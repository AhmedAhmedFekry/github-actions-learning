
name: Environment Example

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  show-environment:
    runs-on: ubuntu-latest

    steps:
      - name: Display selected environment
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          echo "Selected environment: $TARGET_ENV"
